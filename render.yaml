services:
  - type: web
    name: life-os-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install && npm run db:push:prod && npm run build:prod
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: life-os-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false

databases:
  - name: life-os-db
    databaseName: lifeos
    user: lifeos
    plan: free
